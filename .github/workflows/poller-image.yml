name: Poller image

on:
  push:
    branches: [master]
    paths:
      - backend/Dockerfile.poller
      - backend/package.json
      - backend/package-lock.json
      - backend/prisma.config.ts
      - backend/tsconfig.json
      - backend/prisma/**
      - backend/scripts/**
      - backend/src/**
      - backend/test-db-guard.js
      - backend/test-setup.js
      - backend/test-tiers.ts
      - backend/vitest*.ts
      - .github/workflows/poller-image.yml
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - backend/Dockerfile.poller
      - backend/package.json
      - backend/package-lock.json
      - backend/prisma.config.ts
      - backend/tsconfig.json
      - backend/prisma/**
      - backend/scripts/**
      - backend/src/**
      - backend/test-db-guard.js
      - backend/test-setup.js
      - backend/test-tiers.ts
      - backend/vitest*.ts
      - .github/workflows/poller-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: poller-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_PRODUCTION_BRANCH: ${{ vars.NEON_PRODUCTION_BRANCH || 'production' }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ALLOW_TEST_DATABASE_RESET: "1"
      ALLOW_NEON_BRANCH_RESET: "1"
      RUN_STARTUP_INGESTION: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Create production-derived Neon branch
        id: neon
        env:
          NEON_BRANCH_NAME: test-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'push' }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/neon-branch.js ci-create
      - name: Run backend tests
        env:
          DATABASE_URL: ${{ steps.neon.outputs.database_url }}
          TEST_DATABASE_URL: ${{ steps.neon.outputs.database_url }}
        run: npm exec -- prisma generate && npm exec -- prisma migrate deploy && npm run test:unit && npm run test:db:direct
      - name: Run production-data smoke tests on a fresh clone
        run: npm run test:smoke
      - run: npm run build
      - name: Delete Neon branch
        if: always() && steps.neon.outputs.branch_name
        env:
          NEON_BRANCH_NAME: ${{ steps.neon.outputs.branch_name }}
        run: node scripts/neon-branch.js delete

  cleanup-closed-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      NEON_BRANCH_PREFIX: test-pr-${{ github.event.pull_request.number }}-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/neon-branch.js delete-prefix

  image:
    needs: validate
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.poller
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jackwardphillips/twitcher-poller:${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'ghcr.io/jackwardphillips/twitcher-poller:production' || '' }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
