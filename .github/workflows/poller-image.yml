name: Poller image

on:
  push:
    branches: [master]
    paths:
      - backend/Dockerfile.poller
      - backend/package.json
      - backend/package-lock.json
      - backend/tsconfig.json
      - backend/prisma/**
      - backend/src/**
      - .github/workflows/poller-image.yml
  pull_request:
    paths:
      - backend/Dockerfile.poller
      - backend/package.json
      - backend/package-lock.json
      - backend/tsconfig.json
      - backend/prisma/**
      - backend/src/**
      - .github/workflows/poller-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: poller-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: twitcher_test
          POSTGRES_PASSWORD: twitcher_test
          POSTGRES_DB: twitcher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U twitcher_test -d twitcher_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://twitcher_test:twitcher_test@localhost:5432/twitcher_test
      DATABASE_URL: postgresql://twitcher_test:twitcher_test@localhost:5432/twitcher_test
      ALLOW_TEST_DATABASE_RESET: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  image:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.poller
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jackwardphillips/twitcher-poller:${{ github.sha }}
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'ghcr.io/jackwardphillips/twitcher-poller:production' || '' }}
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
